name: CI
on: [push]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt bandit pytest
      - run: bandit -r generated/ -ll
      - run: PYTHONPATH=. pytest tests/ -v