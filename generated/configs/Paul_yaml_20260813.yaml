pipeline:
  name: Paul Pipeline
  description: Data pipeline for Paul table
  owners:
    - Demo
  tags:
    - Demo
  tables:
    - name: Paul
      columns:
        - name: user_id
          type: BIGINT
          primary_key: true
        - name: created_at
          type: TIMESTAMP
        - name: email
          type: STRING
      upstream_lineage: []
  tasks:
    - name: extract
      type: EXTRACT
      query: SELECT * FROM Paul
      destination: Paul_extract
    - name: transform
      type: TRANSFORM
      query: SELECT * FROM Paul_extract
      destination: Paul_transform
    - name: load
      type: LOAD
      query: SELECT * FROM Paul_transform
      destination: Paul_load
  schedule:
    cron: 0 0 * * *
    timeout: 3600